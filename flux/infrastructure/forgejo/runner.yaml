apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
spec:
  replicas: 0
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
        - name: runner
          image: quay.io/buildah/stable
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              # Install forgejo-runner
              ARCH=$(uname -m | sed 's/aarch64/arm64/' | sed 's/x86_64/amd64/')
              curl -fsSL https://code.forgejo.org/forgejo/runner/releases/download/v6.3.1/forgejo-runner-6.3.1-linux-${ARCH}.xz \
                | xz -d > /usr/local/bin/forgejo-runner
              chmod +x /usr/local/bin/forgejo-runner
              TOKEN=$(cat /etc/runner/token)
              # Register runner if not already registered
              if [ ! -f /data/.runner ]; then
                forgejo-runner register \
                  --instance http://forgejo-http.forgejo.svc.cluster.local:3000 \
                  --token "$TOKEN" \
                  --name k3s-runner \
                  --labels buildah:host \
                  --no-interactive
              fi
              forgejo-runner daemon
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-token
              mountPath: /etc/runner
              readOnly: true
      volumes:
        - name: runner-data
          emptyDir: {}
        - name: runner-token
          secret:
            secretName: forgejo-runner-token
