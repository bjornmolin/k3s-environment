apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: rust-r2ps-worker
  namespace: flux-system
spec:
  image: zot.registry.svc.cluster.local:5000/diggsweden/rust-r2ps-worker
  interval: 1m
  insecure: true
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: rust-r2ps-worker-test
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: rust-r2ps-worker
  filterTags:
    pattern: '^test-(?P<ts>\d+)-\w+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: rust-r2ps-worker-stage
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: rust-r2ps-worker
  filterTags:
    pattern: '^stage-(?P<ts>\d+)-\w+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: rust-r2ps-worker-prod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: rust-r2ps-worker
  filterTags:
    pattern: '^prod-(?P<ts>\d+)-\w+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
